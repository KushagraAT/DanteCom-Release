trigger: none  # Prevent manual or repo triggers unless needed

resources:
  pipelines:
    - pipeline: parentPipeline
      source: KushagraAT.DanteCom-Release-ParentPipeline
      trigger:
        branches:
          include:
            - develop  # Adjust based on your branch
            - develop-new
            - develop-new2
            - develop-new3

jobs:
  - job: dependentJob
    steps:
      - script: echo "Pipeline A completed successfully, now running Pipeline B"
